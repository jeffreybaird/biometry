# Hadlock estimated fetal weight formulas and growth standard
#
# Two separate publications. Transcribed by hand from the source PDFs.
#
#   formulas: Hadlock FP, Harrist RB, Sharman RS, Deter RL, Park SK.
#     "Estimation of fetal weight with the use of head, body, and femur
#     measurements - a prospective study."
#     Am J Obstet Gynecol 1985;151(3):333-337. PMID 3881966.
#     Coefficients below are Table II (Model 2, n=276 combined population).
#
#   growth standard: Hadlock FP, Harrist RB, Martinez-Poyer J.
#     "In utero analysis of fetal growth: a sonographic weight standard."
#     Radiology 1991;181(1):129-133. PMID 1887021.

# ================================================================ FORMULAS ===
# All measurements in CENTIMETRES. Weight in grams. log10 is base-10.
efw_formulas:
  ac_fl:
    requires: [ac, fl]
    equation: "log10(W) = 1.304 + 0.05281*AC + 0.1938*FL - 0.004*AC*FL"
    sd_pct: 8.0
    r2_pct: 97.3
    verified: false
    verified_note: >
      Single hand transcription of Table II with no independent check, and no
      chart in this project pairs with it. See known_issues
      unconfirmed_table_ii_rows.

  bpd_ac_fl:
    requires: [bpd, ac, fl]
    equation: "log10(W) = 1.335 - 0.0034*AC*FL + 0.0316*BPD + 0.0457*AC + 0.1623*FL"
    sd_pct: 7.5
    r2_pct: 97.6
    verified: false
    verified_note: >
      Single hand transcription of Table II with no independent check, and no
      chart in this project pairs with it. See known_issues
      unconfirmed_table_ii_rows.

  hc_ac_fl:
    requires: [hc, ac, fl]
    equation: "log10(W) = 1.326 - 0.00326*AC*FL + 0.0107*HC + 0.0438*AC + 0.158*FL"
    sd_pct: 7.5
    r2_pct: 97.6
    verified: true
    note: >
      The authors' recommended general-use model. Independently confirmed
      against LOINC 11746-5 and against INTERGROWTH's 2021 paper. Two outside
      sources publish these coefficients, which is why this row is verified
      without a worked example. Paired with the WHO and NICHD charts.

  bpd_hc_ac_fl:
    requires: [bpd, hc, ac, fl]
    equation: >
      log10(W) = 1.3596 - 0.00386*AC*FL + 0.0064*HC + 0.00061*BPD*AC
                 + 0.0424*AC + 0.174*FL
    sd_pct: 7.4
    r2_pct: 97.7
    verified: false
    verified_note: >
      BLOCKING FOR SLICE 4. Single hand transcription of Table II with no
      independent check, and the hadlock_1991 chart pairs with this formula.
      Re-read Table II's fourth row in the 1985 PDF and set this true before
      the Hadlock 1991 adapter is built.
    note: >
      THIS is the formula the 1991 growth standard was built on. The 1991
      paper reports the model it used had 0.1% mean error and 7.4% SD, which
      matches this row of the 1985 Table III uniquely (Model 1 was 0.3%/7.5%).
      Pair this formula with the hadlock_1991 chart, not hc_ac_fl.

# ========================================================= GROWTH STANDARD ===
hadlock_1991:
  valid_ga_weeks: [10, 40]        # model fitted 10-41; table published 10-40
  ga_units: decimal_weeks_nearest_tenth
  ga_note: >
    The paper codes GA to the nearest tenth of a week: 39 weeks 3 days is
    coded 39.4, not 39.43. Round to one decimal before evaluating.
  paired_formula: bpd_hc_ac_fl
  population: 392 predominantly middle-class white women, certain menstrual dates
  stratification: none

  median:
    equation: "ln(W_grams) = 0.578 + 0.332*MA - 0.00354*MA^2"
    r2_pct: 99.1
    verified: >
      Reproduces the published Table 1 50th percentile to within 0.02% from
      20 weeks onward; 1.1% at 10 weeks.

  # Variance is uniform as a PERCENTAGE of the median across all gestation.
  dispersion:
    model: additive_normal_pct_of_median
    sd_pct: 13.3
    sd_pct_source: back-calculated from the published Table 1 centiles
    centile: "C(alpha) = median * (1 + Z(alpha) * 0.133)"
    published_ratios:                # C/median, constant across all 31 weeks
      p3:  0.750
      p10: 0.830
      p90: 1.170
      p97: 1.250

# =============================================================== ERRATA ======
known_issues:
  - id: microcephalic_fixture_withdrawn
    severity: high
    detail: >
      A fixture named "microcephalic fetus from the 1985 discussion" was
      removed on 2026-08-13. It claimed inputs BPD 5.7 / HC 21.3 / AC 28.5 /
      FL 7.5 cm produce 2415 g under hc_ac_fl against an actual birth weight
      of 2250 g. Those inputs give 1951.6 g under hc_ac_fl, and no formula in
      this file produces 2415 g from them (ac_fl 2556.1, bpd_ac_fl 2032.7,
      bpd_hc_ac_fl 1920.2). The quoted 2415 g is exactly 2250 x 1.073, so the
      example was internally consistent between its output and its error while
      being inconsistent with its own inputs — the signature of a fabricated
      example rather than a mis-transcription. No line in the 1985 paper was
      ever identified as its source. Withdrawn rather than corrected, because
      there is nothing to correct it against. Do not reinstate it without a
      page reference.

  - id: unconfirmed_table_ii_rows
    severity: high
    detail: >
      Only hc_ac_fl has confirmation outside this project's own transcription:
      LOINC 11746-5 and INTERGROWTH's 2021 paper both publish its
      coefficients. ac_fl, bpd_ac_fl and bpd_hc_ac_fl rest on a single hand
      transcription of Table II with nothing checking it, and the withdrawal
      of the microcephalic fixture leaves them with no worked example either.
      All three carry verified: false.

      bpd_hc_ac_fl is the urgent one: the hadlock_1991 growth chart pairs with
      it, so slice 4's Hadlock adapter is blocked until Table II's fourth row
      is re-read from the 1985 PDF and the flag set true.

      ac_fl and bpd_ac_fl are unused — no chart in this project pairs with
      either — and are candidates for removal rather than verification.

  - id: abstract_sd_contradicts_table
    severity: high
    detail: >
      The abstract states variance of +/-12.7% (1 SD). The published Table 1
      centiles are exactly median x {0.750, 0.830, 1.170, 1.250} at every
      week, which implies 13.3%, not 12.7%. Using 12.7% gives a 3rd centile
      of 1187 g at 30 weeks where the paper prints 1169 g. The Discussion
      and Table 3 both say 13%, supporting 13.3% over the abstract.
      IMPLEMENT 13.3%. This discrepancy is the subject of an active 2025
      exchange in AJOG (Roberts et al., "Revisiting the Hadlock 1991
      population reference"; and "The origin of Hadlock's table: a reply").

  - id: table1_week30_p97_typo
    severity: high
    detail: >
      Table 1 prints 1,649 g for the 97th centile at 30 weeks. That is below
      the 90th centile of 1,824 g and therefore impossible. The ratio-implied
      value is 1,949 g. Confirmed by inspecting the page scan, so this is a
      typographical error in the published table rather than an OCR artifact.
      Any verbatim transcription of Table 1 must correct or flag this cell.

# ============================================================== FIXTURES =====
fixtures:
  - name: "1991 median equation at selected weeks"
    expect_g: { 10: 35, 20: 331, 30: 1559, 40: 3619 }
    tolerance_pct: 1.2

  - name: "1991 centiles at 32 weeks"
    inputs: { ga_weeks: 32 }
    expect_g: { p3: 1465, p10: 1621, p50: 1953, p90: 2285, p97: 2441 }
    tolerance_g: 3

  - name: "1991 centiles at 40 weeks"
    inputs: { ga_weeks: 40 }
    expect_g: { p3: 2714, p10: 3004, p50: 3619, p90: 4234, p97: 4524 }
    tolerance_g: 3

accuracy:
  note: >
    1985 Table I gives mean deviation and SD by birth-weight stratum for every
    model. Errors are NOT uniform across fetal size: for hc_ac_fl the mean
    deviation runs from -4.6% below 1500 g to +6.3% above 4000 g. Surface the
    stratum-specific figure rather than the pooled one where weight is known.
