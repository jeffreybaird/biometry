# Hadlock 1985 — estimated fetal weight formulas
#
# Transcribed by hand from the source PDF. Coefficients are Table II
# (Model 2, n = 276, combined population).

source:
  citation: "Hadlock FP, Harrist RB, Sharman RS, Deter RL, Park SK. Estimation of fetal weight with the use of head, body, and femur measurements - a prospective study. Am J Obstet Gynecol 1985;151(3):333-337."
  pmid: "3881966"
  doi: "10.1016/0002-9378(85)90298-4"
  year: 1985
  kind: formulas
  table: "Table II (Model 2, n=276)"

# All measurements in CENTIMETRES, weight in grams, log base 10. Stated here
# as prose rather than as machine-readable keys: nothing reads them, the
# adapter hardcodes all three, and a key documenting what the code already
# hardcodes is a second source of truth waiting to drift out of step.

# Formula ids are global. `paired_formula` in a chart manifest resolves here.
efw_formulas:
  hadlock_ac_fl:
    id: hadlock_ac_fl
    verified: true
    requires: [ac, fl]
    equation: "log10(W) = 1.304 + 0.05281*AC + 0.1938*FL - 0.004*AC*FL"
    sd_pct: 8.0
    r2_pct: 97.3
    used_by: []
    note: "No chart in this project pairs with it."

  hadlock_bpd_ac_fl:
    id: hadlock_bpd_ac_fl
    verified: true
    requires: [bpd, ac, fl]
    equation: "log10(W) = 1.335 - 0.0034*AC*FL + 0.0316*BPD + 0.0457*AC + 0.1623*FL"
    sd_pct: 7.5
    r2_pct: 97.6
    used_by: []
    note: "No chart in this project pairs with it."

  hadlock_hc_ac_fl:
    id: hadlock_hc_ac_fl
    verified: true
    verified_by: >
      Coefficients match LOINC 11746-5 and the INTERGROWTH 2021 paper, two
      sources independent of this transcription.
    requires: [hc, ac, fl]
    equation: "log10(W) = 1.326 - 0.00326*AC*FL + 0.0107*HC + 0.0438*AC + 0.158*FL"
    sd_pct: 7.5
    r2_pct: 97.6
    used_by: [nichd, who]
    note: "The authors' recommended general-use model."

  hadlock_bpd_hc_ac_fl:
    id: hadlock_bpd_hc_ac_fl
    verified: true
    requires: [bpd, hc, ac, fl]
    equation: >
      log10(W) = 1.3596 - 0.00386*AC*FL + 0.0064*HC + 0.00061*BPD*AC
                 + 0.0424*AC + 0.174*FL
    sd_pct: 7.4
    r2_pct: 97.7
    used_by: [hadlock_1991]
    note: >
      The formula the 1991 growth standard was built on. The 1991 paper
      reports its model had 0.1% mean error and 7.4% SD, matching this row of
      the 1985 Table III uniquely (Model 1 was 0.3%/7.5%).

known_issues:
  - id: accuracy_strata_not_transcribed
    severity: medium
    detail: >
      Table I gives mean deviation and SD by birth-weight stratum for every
      model, and the errors are asymmetric: for hadlock_hc_ac_fl the mean
      deviation runs about -4.6% below 1500 g to +6.3% above 4000 g. Only the
      pooled figures are transcribed here. Until the strata are added,
      Estimate#uncertainty must report basis: pooled and PROJECT.md's
      stratum-reporting requirement is deferred, not met.

  - id: microcephalic_fixture_withdrawn
    severity: high
    detail: >
      A fixture previously in this file claimed BPD 5.7, HC 21.3, AC 28.5,
      FL 7.5 cm yields 2415 g under hadlock_hc_ac_fl. The equation yields
      1951.6 g from those inputs, and no formula in this file produces 2415 g
      from them. The fixture was not traceable to the paper and has been
      removed. Do not reinstate it without a page reference.

# EMPTY BY DESIGN. The only fixture this file had was withdrawn (see above).
# Transcribe a worked example from the paper before populating.
fixtures: []
